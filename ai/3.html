<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>See It Working — Source-Driven Traversal</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --text: #202124;
      --muted: #5f6368;
      --card: #ffffff;
      --line: #e2e2de;
      --code: #f1f1ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 12px 0;
    }

    .intro {
      margin: 0 0 42px;
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 680px;
    }

    .hero {
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      margin-bottom: 44px;
    }

    .hero strong {
      font-size: 1.15rem;
    }

    section {
      margin-top: 42px;
    }

    pre {
      margin: 16px 0;
      padding: 20px;
      overflow-x: auto;
      background: var(--code);
      border: 1px solid var(--line);
      border-radius: 12px;
      font: 0.88rem/1.65
        ui-monospace,
        SFMono
